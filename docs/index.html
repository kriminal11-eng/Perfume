<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Parfüm Defteri</title>
  <meta name="description" content="Parfium, Parfimo ve Notino yeni parfümleri, indirim kodları, koleksiyon ve wishlist — Fragrantica bilgileriyle.">
  <meta name="theme-color" content="#16131a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-bottle"/></svg>
      <span>Parfüm Defteri</span>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="btn-search" aria-label="Ara"><svg><use href="#i-search"/></svg></button>
      <button class="icon-btn" id="btn-settings" aria-label="Ayarlar"><svg><use href="#i-gear"/></svg></button>
    </div>
  </header>

  <div id="searchbar" class="searchbar hidden">
    <input id="q" type="search" placeholder="Marka, parfüm, nota ara…" autocomplete="off">
  </div>

  <main id="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar">
    <button data-tab="new"><svg><use href="#i-spark"/></svg><span>Yeniler</span><i class="badge" id="b-new"></i></button>
    <button data-tab="codes"><svg><use href="#i-tag"/></svg><span>Kodlar</span><i class="badge" id="b-codes"></i></button>
    <button data-tab="collection"><svg><use href="#i-bottle"/></svg><span>Koleksiyon</span></button>
    <button data-tab="wishlist"><svg><use href="#i-heart"/></svg><span>Wishlist</span></button>
    <button data-tab="library"><svg><use href="#i-book"/></svg><span>Kütüphane</span></button>
  </nav>

  <div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel">
      <div class="sheet-top"><div class="sheet-grip" data-close></div><button class="icon-btn sheet-x" data-close aria-label="Kapat">✕</button></div>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Icons -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <symbol id="i-bottle" viewBox="0 0 32 32"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 3h8v4h-8zM13 7v3M19 7v3M9 13a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3h-8a3 3 0 0 1-3-3z"/><path fill="currentColor" opacity=".35" d="M10 18h12v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7.4-2.2.1-1.3-.1-1.3 2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.2-1.3L14.4 3h-4l-.4 2.4a7.6 7.6 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6-.1 1.3.1 1.3-2 1.6 2 3.4 2.4-1c.7.6 1.4 1 2.2 1.3l.4 2.4h4l.4-2.4c.8-.3 1.5-.7 2.2-1.3l2.4 1 2-3.4z"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.2 6.3L20.5 10l-6.3 2.2L12 18.5l-2.2-6.3L3.5 10l6.3-1.7zM19 15l1 2.6 2.5 1-2.5 1-1 2.4-1-2.4-2.5-1 2.5-1z"/></symbol>
      <symbol id="i-tag" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20s-7.5-4.6-9-9.3C1.9 7.3 4.2 4 7.6 4c2 0 3.4 1.1 4.4 2.6C13 5.1 14.4 4 16.4 4c3.4 0 5.7 3.3 4.6 6.7C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-heart-f" viewBox="0 0 24 24"><path fill="currentColor" d="M12 20s-7.5-4.6-9-9.3C1.9 7.3 4.2 4 7.6 4c2 0 3.4 1.1 4.4 2.6C13 5.1 14.4 4 16.4 4c3.4 0 5.7 3.3 4.6 6.7C19.5 15.4 12 20 12 20z"/></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-ext" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></symbol>
      <symbol id="i-camera" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
      <!-- seasons / time -->
      <symbol id="s-winter" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7"/><path d="m9.5 3.5 2.5 2 2.5-2M9.5 20.5l2.5-2 2.5 2M3.8 10.3l3-.6-.9-2.9M20.2 13.7l-3 .6.9 2.9M3.8 13.7l3 .6-.9 2.9M20.2 10.3l-3-.6.9-2.9"/></g></symbol>
      <symbol id="s-spring" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="12" cy="6.5" r="3.3"/><circle cx="17.2" cy="10.3" r="3.3"/><circle cx="15.2" cy="16.4" r="3.3"/><circle cx="8.8" cy="16.4" r="3.3"/><circle cx="6.8" cy="10.3" r="3.3"/></g><circle cx="12" cy="12" r="2.6" fill="var(--bg2)"/></symbol>
      <symbol id="s-summer" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"/></g></symbol>
      <symbol id="s-fall" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5l1.6 3.6 2.6-1.4-.4 3.6 3.6-.6-1.6 3.1 3 1.4-3.2 1.8 1 2.4-3.6-.4.2 3.6-3.2-1.8-1.6 3.4-1.6-3.4-3.2 1.8.2-3.6-3.6.4 1-2.4L1.2 12.2l3-1.4-1.6-3.1 3.6.6-.4-3.6 2.6 1.4z"/><path stroke="var(--bg2)" stroke-width="1.2" d="M12 8v13"/></symbol>
      <symbol id="s-day" viewBox="0 0 24 24"><use href="#s-summer"/></symbol>
      <symbol id="s-night" viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/><circle cx="17.5" cy="5" r="1" fill="currentColor"/><circle cx="20.5" cy="8.5" r=".8" fill="currentColor"/></symbol>
    </defs>
  </svg>

  <script src="app.js?v=3" type="module"></script>
</body>
</html>
